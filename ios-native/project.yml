# Krypta — native iOS-App. Erzeugen mit: xcodegen generate
#
# Gleiche Bundle-ID und gleiches Team wie die Flutter-App (ios/), damit
# der Neubau sie im App Store ablösen kann. Solange beide nebeneinander
# entwickelt werden, lässt sich auf einem Gerät nur eine installieren.
name: Krypta
options:
  bundleIdPrefix: com.calcchat
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: B97SQSQBMR
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  KryptaCore:
    path: KryptaCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
targets:
  Krypta:
    type: application
    platform: iOS
    sources:
      - path: Krypta
      - path: Shared
    dependencies:
      - package: KryptaCore
        product: KryptaCore
      - package: KryptaCore
        product: KryptaMessenger
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseMessaging
      - target: KryptaNotifications
    entitlements:
      path: Krypta/Krypta.entitlements
      properties:
        aps-environment: development
        # Erster Eintrag: wie in der Flutter-App (ios/Runner), damit deren
        # Schlüsselbund lesbar bleibt. Zweiter: geteilt mit der Extension.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.calcchat.ww
          - $(AppIdentifierPrefix)com.calcchat.ww.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calcchat.ww
        PRODUCT_NAME: Krypta
        INFOPLIST_KEY_CFBundleDisplayName: Krypta
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Die Kamera scannt den QR-Code eines Kontakts."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID entsperrt Krypta, ohne dass du einen Code eingibst."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
  # Notification Service Extension: macht aus „Neue Nachricht" ein
  # „Neue Nachricht von Mami", ohne den Inhalt zu kennen. Siehe
  # KryptaCore/Messaging/NotificationTag.swift.
  KryptaNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: KryptaNotifications
      - path: Shared
    dependencies:
      - package: KryptaCore
        product: KryptaCore
    entitlements:
      path: KryptaNotifications/KryptaNotifications.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.calcchat.ww.shared
    info:
      path: KryptaNotifications/Info.plist
      properties:
        CFBundleDisplayName: Krypta
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calcchat.ww.NotificationService
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  KryptaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KryptaUITests
    dependencies:
      - target: Krypta
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calcchat.ww.uitests
        GENERATE_INFOPLIST_FILE: YES
        # XCUIElement ist @MainActor; UI-Tests laufen ohnehin auf dem Main Thread.
        SWIFT_STRICT_CONCURRENCY: minimal
        TEST_TARGET_NAME: Krypta
schemes:
  Krypta:
    build:
      targets:
        Krypta: all
    test:
      targets:
        - KryptaUITests
